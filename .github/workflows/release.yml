name: Auto Release on Push

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version
        id: bump
        run: |
          BUILD_FILE="app/build.gradle.kts"

          versionCode=$(grep -oP 'versionCode\s*=\s*\K\d+' "$BUILD_FILE")
          versionName=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$BUILD_FILE")

          echo "Current: versionCode=$versionCode, versionName=$versionName"

          newVersionCode=$((versionCode + 1))

          # Loop until we find a tag that doesn't exist yet
          IFS='.' read -r major minor patch <<< "$versionName"
          patch=${patch:-0}
          while true; do
            newPatch=$((patch + 1))
            newVersionName="$major.$minor.$newPatch"
            if ! git rev-parse "v$newVersionName" >/dev/null 2>&1; then
              break
            fi
            patch=$newPatch
          done

          echo "New: versionCode=$newVersionCode, versionName=$newVersionName"

          sed -i "s/versionCode = $versionCode/versionCode = $newVersionCode/" "$BUILD_FILE"
          sed -i "s/versionName = \"$versionName\"/versionName = \"$newVersionName\"/" "$BUILD_FILE"

          echo "versionCode=$newVersionCode" >> $GITHUB_OUTPUT
          echo "versionName=$newVersionName" >> $GITHUB_OUTPUT

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "Bump version to ${{ steps.bump.outputs.versionName }} [skip ci]"
          git tag "v${{ steps.bump.outputs.versionName }}"
          git push origin main --tags

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare env for CI
        run: cp .env.example .env

      - name: Generate debug keystore
        run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=, OU=, O=, L=, S=, C="

      - name: Create dummy google-services.json
        run: |
          echo '{"project_info":{"project_number":"0","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:000","android_client_info":{"package_name":"com.aistudio.volumeassistant.vctrl"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"analytics_service":{"status":1},"appinvite_service":{"status":1},"ads_service":{"status":1}}}]}' > app/google-services.json

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.versionName }}
          name: Release v${{ steps.bump.outputs.versionName }}
          body: |
            ## Auto-generated Release

            - **Version:** ${{ steps.bump.outputs.versionName }}
            - **Version Code:** ${{ steps.bump.outputs.versionCode }}
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
